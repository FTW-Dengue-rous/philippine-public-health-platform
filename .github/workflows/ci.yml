name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    name: Python lint & format (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the auto-fix commit
    steps:
      - uses: actions/checkout@v4
        with:
          # On PRs, check out the actual branch (not the merge commit) so fixes can be pushed back
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          # PAT lets the fix commit re-trigger CI; falls back to the default token
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pre-commit

      # Auto-fix: run the fixer hooks, then push any changes back to the PR branch
      - name: Auto-fix and push (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          for hook in ruff ruff-format end-of-file-fixer trailing-whitespace; do
            pre-commit run "$hook" --all-files || true
          done
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -am "style: auto-fix lint (ruff, EOF, whitespace)"
            git push
          fi

      # Uses the same hooks + pinned versions as local commits (.pre-commit-config.yaml).
      # After auto-fix, these fail only on issues ruff can't fix itself (undefined names, etc.)
      - name: ruff lint
        run: pre-commit run ruff --all-files --show-diff-on-failure
      - name: ruff format
        run: pre-commit run ruff-format --all-files --show-diff-on-failure
      - name: End-of-file newline
        run: pre-commit run end-of-file-fixer --all-files --show-diff-on-failure
      - name: Trailing whitespace
        run: pre-commit run trailing-whitespace --all-files --show-diff-on-failure

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest --cov=src --cov-report=term-missing

  sql-lint:
    name: SQL lint (sqlfluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install sqlfluff==4.3.0
      - name: Lint .sql files (skips if none)
        run: |
          files=$(git ls-files '*.sql')
          if [ -z "$files" ]; then echo "No SQL files yet — skipping."; exit 0; fi
          sqlfluff lint $files

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Uses the gitleaks CLI directly: gitleaks-action needs a license key for org-owned repos
      - name: Install gitleaks (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gitleaks/gitleaks --pattern '*_linux_x64.tar.gz' --output gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan git history for secrets
        run: ./gitleaks git . --redact --verbose

  repo-hygiene:
    name: Repo hygiene (large files, notebook outputs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block files over 5 MB
        run: |
          big=$(git ls-files -z | xargs -0 -r du -k | awk '$1 > 5120 {print $2}')
          if [ -n "$big" ]; then
            echo "::error::Files over 5 MB found — keep datasets out of Git:"; echo "$big"; exit 1
          fi
          echo "No large files."
      - name: Block Jupyter notebooks with saved outputs
        run: |
          python - <<'PY'
          import json, subprocess, sys
          nbs = subprocess.run(["git", "ls-files", "*.ipynb"], capture_output=True, text=True).stdout.split()
          bad = [nb for nb in nbs
                 if any(c.get("outputs") for c in json.load(open(nb, encoding="utf-8")).get("cells", []))]
          if bad:
              print("::error::Clear notebook outputs before committing:", *bad, sep="\n")
              sys.exit(1)
          print(f"Checked {len(nbs)} notebook(s) — clean.")
          PY
