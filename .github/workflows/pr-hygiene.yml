name: PR Hygiene

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write   # labeler may need to create new labels

jobs:
  title:
    name: PR title format
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  label:
    name: Label by changed folders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true

  assign:
    name: Assign reviewers (fixed checker)
    if: >-
      !github.event.pull_request.draft &&
      (github.event.action == 'opened' ||
       github.event.action == 'reopened' ||
       github.event.action == 'ready_for_review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('.github/reviewers.json', 'utf8'));
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const lower = (s) => s.toLowerCase();

            // Skip WIP / draft titles
            if (/\b(wip|draft)\b/i.test(pr.title)) {
              core.info('Title marked WIP/draft - skipping reviewer assignment.');
              return;
            }

            // Default reviewer + the author's fixed checker (author can't review own PR)
            const checkers = Object.fromEntries(
              Object.entries(cfg.checkers).map(([a, c]) => [lower(a), c])
            );
            const reviewers = new Set();
            if (cfg.default_reviewer) reviewers.add(cfg.default_reviewer);
            const checker = checkers[lower(author)];
            if (checker) reviewers.add(checker);
            else core.warning(`No checker mapped for ${author} in .github/reviewers.json`);
            for (const r of [...reviewers]) if (lower(r) === lower(author)) reviewers.delete(r);

            const base = { owner: context.repo.owner, repo: context.repo.repo };
            if (reviewers.size) {
              try {
                await github.rest.pulls.requestReviewers({
                  ...base, pull_number: pr.number, reviewers: [...reviewers],
                });
                core.info(`Requested review from: ${[...reviewers].join(', ')}`);
              } catch (e) {
                core.setFailed(`Could not request ${[...reviewers].join(', ')} - ` +
                  `check they accepted the repo invite. (${e.message})`);
              }
            }

            // Assign the PR to its author
            await github.rest.issues.addAssignees({
              ...base, issue_number: pr.number, assignees: [author],
            });
