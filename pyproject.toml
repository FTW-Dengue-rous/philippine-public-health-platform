[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# E/F = errors, I = import order, B = common bugs, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]
# Databricks notebooks exported as .py use `spark`, `dbutils`, `display` globals
[tool.ruff.lint.per-file-ignores]
"src/**" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.databricks.environment]
environment_version = '6'
