  # ---------------------------------------------------------------------------
  # 16. IHME Global Burden of Disease 2023: province x year, 2019-2023  (OPEN, attribution)
  # ---------------------------------------------------------------------------
  ihme_gbd:
    description: IHME GBD 2023 modelled deaths and prevalence by cause, Philippine provinces
    agency: Institute for Health Metrics and Evaluation (IHME)
    obtained_via: GBD Results tool (vizhub.healthdata.org/gbd-results), CSV export with IDs
    url: https://vizhub.healthdata.org/gbd-results/
    citation: >-
      Global Burden of Disease Collaborative Network. Global Burden of Disease Study 2023
      (GBD 2023) Results. Seattle, United States: Institute for Health Metrics and Evaluation
      (IHME), 2024. Available from https://vizhub.healthdata.org/gbd-results/.
    path: diseases/ihme_gbd
    files:
      - ihme_gbd_neoplasms_province_annual_2019_2023.csv       # Neoplasms + 34 child causes
      - ihme_gbd_main_causes_province_annual_2019_2023.csv     # 12 causes incl. COVID-19
    delimiter: ","
    encoding: utf-8
    header_mode: single
    skip_rows: 0
    required_columns: [measure_id, location_id, cause_id, year, val, upper, lower]
    bronze_table: "public_health.bronze.diseases_ihme_gbd_bronze"
    as_of_date: 2026-10-05                 # download date
    load_mode: upsert
    merge_keys: [measure_id, location_id, sex_id, age_id, cause_id, metric_id, year]
    sharing: restricted                    # non-commercial use only; no redistribution of the data
    license: IHME Free-of-Charge Non-Commercial User Agreement
    license_url: https://www.healthdata.org/Data-tools-practices/data-practices/ihme-free-charge-non-commercial-user-agreement
    attribution: "Source: Institute for Health Metrics and Evaluation. Used with permission. All rights reserved."
    coverage: 2019-2023 annual, 81 provinces + NCR (no national or region rows); Both sexes, All ages, Number
    disease:
      geo_level: province
      period_grain: year
      metrics: [deaths, prevalence]
    qc:
      expected_rows:
        ihme_gbd_neoplasms_province_annual_2019_2023.csv: 28700
        ihme_gbd_main_causes_province_annual_2019_2023.csv: 9840
      numeric_columns: [val, upper, lower]
    notes:
      - "Licence: analyses, charts and presentations may be published with the attribution line and citation. The data itself may not be redistributed: do not commit the files to GitHub, do not offer row-level export or download of IHME values, and keep IHME out of any dataset shared outside the team. Link to the IHME tool instead."
      - Modelled estimates, not counts. Never sum with PSA or FHSIS; keep a separate source_key.
      - Cause 410 Neoplasms is level 2, parent of the 34 neoplasm causes (level 3). Deaths of the children sum exactly to 410; prevalence of the children overshoots 410 by 0.3-1.1%. Never sum across levels.
      - Cause 410 is in both files with identical values; silver dedupes on merge_keys.
      - The cause Other neoplasms is benign (55% of 2023 neoplasm prevalence). Malignant prevalence = 410 - Other neoplasms - Non-melanoma skin cancer.
      - Use deaths only for Tuberculosis (prevalence includes latent infection), Chronic kidney disease (all stages), Dengue, Lower respiratory infections and COVID-19 (acute; COVID 2019 prevalence shows 213).
      - Location names are GBD spellings ("Cotabato (North Cotabato)", "Samar (Western Samar)"); location_id is the join key to the geo crosswalk.
      - Download straight from the tool; never open and save in Excel (an earlier copy had its val column overwritten).

  # ---------------------------------------------------------------------------
  # 19. PhilHealth claims by hospital, selected illnesses, 2016-2025  (RESTRICTED)
  # ---------------------------------------------------------------------------
  philhealth_foi_claims_hospital:
    description: PhilHealth claims count and amount by admission year, health facility, illness (case-rate package) and claim status
    agency: PhilHealth
    obtained_via: eFOI
    ticket_number: FOI-REQ-2026-6223      # from the FOI request transmittal (eFOI, filed 2026-09-30)
    request_date: 2026-09-30
    original_file: FOI_PH-20266223.xlsx
    path: diseases/restricted/philhealth_foi/philhealth_claims_hospital_annual_2016_2025.xlsx
    format: xlsx
    sheet: FOI20266223
    header_mode: single
    skip_rows: 0
    bronze_table: "public_health.bronze.diseases_philhealth_claims_hospital_bronze"
    required_columns: ["Admit Year", "HF Name", "HF Region", "HF Province", "HF Municipality", "HF Sector",
                       "Illness Description", "Claim Status", "Claims Count", "Claims Amount"]
    as_of_date: 2026-10-14                # date the file was received
    load_mode: upsert
    merge_keys: [admit_year, facility_name, facility_municipality, illness_description, claim_status]
    sharing: restricted                   # D-47: FOI release for academic use; aggregates only, cells < 3 suppressed (as stated in the request)
    silver_target: "public_health.silver.diseases_hospital_claims_silver"   # planned
    coverage: admission years 2016-2025; 2,294 facilities in 86 province labels; 14 illness packages; 4 claim statuses
    column_map:
      Admit Year: admit_year
      HF Name: facility_name
      HF Region: facility_region_label
      HF Province: facility_province
      HF Municipality: facility_municipality
      HF Sector: ownership
      Illness Description: illness_description
      Claim Status: claim_status
      Claims Count: claims_count
      Claims Amount: claims_amount_php
    qc:
      expected_rows: 245405
      numeric_columns: [Admit Year, Claims Count, Claims Amount]
      control_totals:                     # sum of Claims Count per admission year, all claim statuses; also silver QC S34
        group_by: Admit Year
        sum: Claims Count
        expected: {2016: 1709849, 2017: 1626227, 2018: 1706320, 2019: 2018226, 2020: 804669,
                   2021: 622815, 2022: 920348, 2023: 1177840, 2024: 1451867, 2025: 1540811}
    notes:
      - "Requested vs received: we asked for patient residence (preferred) or the HCI-level fallback. PhilHealth sent the FALLBACK: no patient residence, no accreditation number, no HCI level/class, no month, no ICD-10 codes (case-rate package names only)."
      - "Conditions requested: dengue (A90-A91, A97), pneumonia (J12-J18), hypertensive diseases (I10-I15), ischaemic heart diseases (I20-I25), cerebrovascular diseases (I60-I69). All 5 are present as case-rate packages; CHRONIC HEART DISEASES, ENCEPHALOPATHY and PRIMARY CARE also appear. TB was not requested."
      - "We requested amount PAID; the file's Claims Amount is filled for every status, so treat it as amount claimed."
      - "Claims, not patients or admissions: only PhilHealth-filed confinements; one patient can have more than one claim; non-members paying out of pocket are not in the data."
      - "Place = the HOSPITAL's location, not the patient's residence. It shows where care is delivered; it cannot measure travel distance."
      - "Claim Status: PAID, DENIED, RTH (returned to hospital), IN-PROCESS. Utilization = all statuses (claims filed). Money paid = PAID only. Claims Amount is filled for every status, so it is the amount claimed."
      - "Illness Description = PhilHealth case-rate package names, with severity in the name (PNEUMONIA MODERATE RISK / HIGH RISK, DENGUE FEVER / SEVERE, STROKE INFARCTION / HEMORRHAGIC ...). HYPERTENSIVE EMERGENCYURGENCY is spelled that way in the source. 1,404 rows have no illness (blank); PRIMARY CARE has 40 rows."
      - "No PSGC and no facility code. Match facilities to facilities_registry_silver by name + municipality in silver; 8 facility names appear in more than one municipality."
      - "Labels need cleaning: HF Region has leading/trailing spaces and PhilHealth office labels (III-A, III-B), so take the region from the province's PSGC instead; Metro Manila is written with 1 to 3 spaces."
      - "112 key combinations repeat with different counts or amounts (separate sub-rows of the same hospital, illness and status); 19 rows are exact repeats. Sum them in silver; do not drop rows. Bronze QC B08 shows the 19 as WARN."
      - "2025 is not final: 7,568 claims still IN-PROCESS (vs 300 to 2,000 in earlier years), and late-2025 admissions may not be filed yet."
      - "Average claim amount jumps from about 14,600 PHP (2016-2023) to 21,000 (2024) and 29,500 (2025): case rates changed. Do not trend money across 2024 without flagging it."
      - "ISCHEMIC HEART DISEASE WITH MYOCARDIAL INFARCTION falls from 31,722 claims (2024) to 6,164 (2025): likely moved to another benefit package. Check before trending heart claims into 2025."
      - "2020-2021 claims drop by more than half (COVID period); mark them, do not read them as less disease."

