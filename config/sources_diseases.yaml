      - Vaccine-preventable diseases (measles, diphtheria, whooping cough, tetanus, acute flaccid paralysis) feed the vaccination thread.
      - Leptospirosis is national only; it does not replace the pending FOI.
      - "Red tide has ... and … (not available). Null, not zero."
      - Disease names have trailing spaces (Cholera, Neonatal Tetanus); trim in silver.

