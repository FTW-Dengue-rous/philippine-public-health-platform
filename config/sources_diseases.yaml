    bronze_table: "public_health.bronze.diseases_psa_notifiable_national_annual_bronze"
    as_of_date: 2026-10-05
    load_mode: upsert
    merge_keys: [disease_name, year]
    sharing: open
    coverage: 2014-2021 annual, national, 22 diseases
    wide_columns:                          # years are columns; unpivot to (year, cases) in silver
      name_pattern: "^[0-9]{4}$"
      value_name: cases
    disease:
      geo_level: national
      period_grain: year
      metrics: [cases]
    qc:
      expected_rows: 23                   # 22 diseases + the source line
