    path: diseases/psa_morbidity/national_annual
    files:
      - psa_morbidity_leading_national_annual_2016_2018.csv     # PSY 2019/2020, Table 9.12
      - psa_morbidity_leading_national_annual_2021_2023.csv     # PSY 2025, Table 9.13
    delimiter: ","
    encoding: utf-8
    header_mode: none                      # one block per year; block header row holds the year
    data_start_row: 0
    bronze_table: "public_health.bronze.diseases_psa_morbidity_leading_national_annual_bronze"
    header_check:
      - {row: 0, expect: {0: "Leading Causes of Morbidity"}}
      - {row: 3, expect: {0: "of Morbidity"}}
      - {row: 4, expect: {1: "Number of Cases", 3: "Rate"}}
    as_of_date: 2026-10-05
    load_mode: upsert
    merge_keys: [cause_name, year]
