  # 14. PSA notifiable diseases: national x year, 2014-2021  (OPEN)
  # ---------------------------------------------------------------------------
  psa_notifiable_national_annual:
    description: Selected notifiable diseases, reported cases by cause, Philippines
    agency: Philippine Statistics Authority (from DOH Philippine Health Statistics)
    obtained_via: Philippine Statistical Yearbook 2025, Table 9.15
    original_file: 2025_T9_15.csv
    path: diseases/psa_notifiable/national_annual
    files:
      - psa_notifiable_national_annual_2014_2021.csv
    delimiter: ","
    encoding: cp1252
    header_mode: single
    skip_rows: 2                           # row 0 = title, row 2 = header (Notifiable Diseases, 2014 .. 2021)
    required_columns: ["Notifiable Diseases", "2014", "2021"]
    header_check:
      - {row: 0, expect: {0: "Notifiable Diseases Reported Cases by Cause"}}
    bronze_table: "public_health.bronze.diseases_psa_notifiable_national_annual_bronze"
    as_of_date: 2026-10-05                 # download date; CONFIRM
    load_mode: upsert
    merge_keys: [disease_name, year]
    sharing: open
    coverage: 2014-2021 annual, national, 22 diseases
    wide_columns:                          # years are columns; unpivot to (year, cases) in silver
      name_pattern: "^[0-9]{4}$"
      value_name: cases
    disease:
      geo_level: national
      period_grain: year
      metrics: [cases]
    qc:
      expected_rows: 23                   # 22 diseases + the source line
      numeric_columns: ["2014", "2021"]
      null_tokens: ["...", "…"]
