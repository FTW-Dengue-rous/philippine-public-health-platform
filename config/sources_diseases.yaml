    qc:
      expected_rows:
        psa_morbidity_leading_national_annual_2016_2018.csv: 39
        psa_morbidity_leading_national_annual_2021_2023.csv: 39
      skip_checks: [B08]                  # "Number of Cases, Rate" sub-header repeats per block
    notes:
      - Columns are col_0 = cause, col_1 = cases, col_3 = rate. Year is in col_1 of the block header row ("Disease/Cause of Morbidity", 2016); carry it down in silver.
      - Top-10 lists change every year, so this is not a continuous series per disease. Use for context.
      - Names drift ("ALTRI & Pneumonia" 2016-2018 vs separate "Pneumonia" and "Acute Lower Respiratory Tract Infection" from 2021). Map to disease_key in silver.
      - Rank prefixes ("1. ") appear from 2017; 2017 lists rank 3 before rank 2 and two rank 8s. Strip ranks; order by cases.
      - The 2024 yearbook Table 9.12 is the same data as 2025 Table 9.13; not ingested.

  # ===========================================================================
  # Modelled estimates
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 16. IHME Global Burden of Disease 2023: province x year, 2019-2023  (OPEN, attribution)
  # ---------------------------------------------------------------------------
  ihme_gbd:
    description: IHME GBD 2023 modelled deaths and prevalence by cause, Philippine provinces
    agency: Institute for Health Metrics and Evaluation (IHME)
    obtained_via: GBD Results tool (vizhub.healthdata.org/gbd-results), CSV export with IDs
    url: https://vizhub.healthdata.org/gbd-results/
    citation: >-
      Global Burden of Disease Collaborative Network. Global Burden of Disease Study 2023
      (GBD 2023) Results. Seattle, United States: Institute for Health Metrics and Evaluation
      (IHME), 2024. Available from https://vizhub.healthdata.org/gbd-results/.
    path: diseases/ihme_gbd
    files:
      - ihme_gbd_neoplasms_province_annual_2019_2023.csv       # Neoplasms + 34 child causes
      - ihme_gbd_main_causes_province_annual_2019_2023.csv     # 12 causes incl. COVID-19
    delimiter: ","
    encoding: utf-8
    header_mode: single
    skip_rows: 0
    required_columns: [measure_id, location_id, cause_id, year, val, upper, lower]
    bronze_table: "public_health.bronze.diseases_ihme_gbd_bronze"
    as_of_date: 2026-10-05
    load_mode: upsert
    merge_keys: [measure_id, location_id, sex_id, age_id, cause_id, metric_id, year]
    sharing: restricted                    # non-commercial use only; no redistribution of the data
    license: IHME Free-of-Charge Non-Commercial User Agreement
    license_url: https://www.healthdata.org/Data-tools-practices/data-practices/ihme-free-charge-non-commercial-user-agreement
    attribution: "Source: Institute for Health Metrics and Evaluation. Used with permission. All rights reserved."
    coverage: 2019-2023 annual, 81 provinces + NCR (no national or region rows); Both sexes, All ages, Number
    disease:
      geo_level: province
      period_grain: year
      metrics: [deaths, prevalence]
    qc:
      expected_rows:
        ihme_gbd_neoplasms_province_annual_2019_2023.csv: 28700
        ihme_gbd_main_causes_province_annual_2019_2023.csv: 9840
      numeric_columns: [val, upper, lower]
    notes:
      - "Licence: analyses, charts and presentations may be published with the attribution line and citation. The data itself may not be redistributed: do not commit the files to GitHub, do not offer row-level export or download of IHME values, and keep IHME out of any dataset shared outside the team. Link to the IHME tool instead."
      - Modelled estimates, not counts. Never sum with PSA or FHSIS; keep a separate source_key.
      - Cause 410 Neoplasms is level 2, parent of the 34 neoplasm causes (level 3). Deaths of the children sum exactly to 410; prevalence of the children overshoots 410 by 0.3-1.1%. Never sum across levels.
      - Cause 410 is in both files with identical values; silver dedupes on merge_keys.
      - The cause Other neoplasms is benign (55% of 2023 neoplasm prevalence). Malignant prevalence = 410 - Other neoplasms - Non-melanoma skin cancer.
      - Use deaths only for Tuberculosis (prevalence includes latent infection), Chronic kidney disease (all stages), Dengue, Lower respiratory infections and COVID-19 (acute; COVID 2019 prevalence shows 213).
      - Location names are GBD spellings ("Cotabato (North Cotabato)", "Samar (Western Samar)"); location_id is the join key to the geo crosswalk.
      - Download straight from the tool; never open and save in Excel (an earlier copy had its val column overwritten).

