  # ---------------------------------------------------------------------------
  # 13. PSA deaths, all causes: region x year, 1992-2023  (OPEN)
  # ---------------------------------------------------------------------------
  psa_deaths_allcause_region_annual:
    description: Registered deaths (all causes) and crude death rate per 1,000 by region of usual residence
    agency: Philippine Statistics Authority
    obtained_via: Philippine Statistical Yearbook 2025, Table 9.5
    original_file: 2025_T9_5.csv
    path: diseases/psa_deaths/region_annual_allcause
    files:
      - psa_deaths_allcause_region_annual_1992_2023.csv
    delimiter: ","
    encoding: cp1252
    header_mode: none                      # two stacked blocks; block headers at rows 3-4 and 41-42
    data_start_row: 0
    bronze_table: "public_health.bronze.diseases_psa_deaths_allcause_region_annual_bronze"
    header_check:
      - {row: 0, expect: {0: "Number of Registered Deaths and Rates by Region"}}
      - {row: 3, expect: {0: "Year", 1: "Total", 3: "NCR", 19: "Region VI"}}
      - {row: 4, expect: {1: "Number", 2: "Rate"}}
      - {row: 41, expect: {0: "Year", 1: "Region VII", 15: "BARMM", 17: "Foreign"}}
    as_of_date: 2026-10-05
    load_mode: upsert
    merge_keys: [region_name, year]
    sharing: open
    coverage: 1992-2023 annual, Philippines + 17 regions + Foreign (no Negros Island Region)
    disease:
      disease_key: all_causes
      geo_level: [national, region]
      period_grain: year
      metrics: [deaths]
    qc:
      expected_rows: 79                   # 64 year rows + block titles, headers, notes and source lines
    notes:
      - Block 1 rows 6-37 (Total, NCR..Region VI), block 2 rows 44-75 (Region VII..BARMM, Foreign). Region names come from rows 3 and 41; each region has a Number and a Rate column.
      - "… (cp1252 byte 0x85) = region did not exist yet (MIMAROPA before 2003, Caraga before 1996, BARMM before 1993). Null, not zero."
      - Regions + Foreign = Total for every year (checked). National 2020-2023 equal the PSA monthly files.
      - 2021 Region XII / BARMM boundary differs (file notes 4-5). Year "2014 " has a trailing space.
      - Rates use population projections; recompute rates in gold. Title, notes and source rows load as rows; drop in silver.

