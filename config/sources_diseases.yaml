# =============================================================================
# sources_diseases.yaml — disease domain
#
# One entry per source. The bronze loader reads an entry, loads the file(s)
# to bronze with every data column as STRING, and adds the lineage columns:
#   _rescued_data | _source_key | _source_file | _source_sheet |
#   _source_row_num | _as_of_date | _ingested_at
#
# Conventions
#   - Entry name = source_key = folder name. Never change a key once in use.
#   - Bronze keeps the ORIGINAL column names from the file. Only characters
#     Delta does not allow (space , ; { } ( ) = tab newline) and "." become "_".
#     Renaming to standard names (column_map) happens in silver.
#   - path is relative to landing_root. Use `files:` to list files explicitly,
#     or a glob in `path`.
#   - as_of_date = date the file was downloaded or released (NOT load time).
#     A file in `files:` can override it: {name: x.csv, as_of_date: 2026-11-01}
#   - header_mode:
#       single -> the file has one clean header row (at index skip_rows)
#       names  -> column names are listed here in `columns` (list, or {position: name});
#                 data starts at data_start_row. Use for titles / multi-row headers.
#                 Unnamed positions become col_<n>.
#       none   -> col_0, col_1, ... (stacked tables with no consistent columns)
#   - A file in `files:` can be a dict and override: sheet, data_start_row, skip_rows,
#     encoding, encoding_errors, delimiter, as_of_date, header_mode, columns,
#     required_columns, header_check. Format is taken from the file extension.
#   - enabled: false -> skipped when source_keys = ALL (still runs if named explicitly).
#   - Row numbers are 0-based, counted from the first row of the file/sheet.
#   - Bronze tables are named <domain>_<source>_<content>_bronze, e.g. diseases_hdx_dengue_bronze.
#   - One folder = one layout = one bronze table. A new file goes into the folder that
#     matches its geography level and grain, and is added to that entry's `files:` list.
#   - load_mode (used by silver): upsert -> per merge key keep the row with the
#     latest _as_of_date. Bronze always keeps every file.
#   - qc: settings used by the bronze QC script.
#
# Ingestion-contract checks (run by the loader BEFORE anything is written)
#   - header_check: the physical title/header rows must contain the expected text at
#     the expected positions (case and spacing ignored, "contains" match). Checked on the
#     raw rows, before YAML column names are applied, so a shifted or inserted column
#     stops the load instead of loading values under the wrong names.
#       header_check:
#         - {row: 3, expect: {0: "Year", 1: "Total", 3: "NCR"}}
#     Use it on every header_mode: names / none entry. To see the rows of a file, run
#       python diseases_bronze.py --show_headers 10 --source_keys <key>
#   - required_columns: for header_mode: single, header names that must exist (raw
#     names as in the file; they are cleaned the same way as the header).
#   - encoding_errors: strict (default) stops on a byte that does not fit the encoding.
#     Set replace on an entry to load anyway; replaced bytes are counted and logged.
# =============================================================================

version: 1

landing_root: /Volumes/workspace/default/ftw-b12-de/groups/g5_landing

defaults:
  domain: diseases
  all_columns_as_string: true
  load_mode: upsert
  silver_enabled: true
  encoding_errors: strict
  metadata_table: "public_health.bronze.ingestion_metadata"
  qc_results_table: "public_health.bronze.qc_results"
  silver_target: "public_health.silver.diseases_metric_silver"

sources:

  # ---------------------------------------------------------------------------
  # 1. DOH FOI dengue: region x month, Jan 2021 to Sep 2025  (RESTRICTED)
  # ---------------------------------------------------------------------------
  doh_foi_dengue:
    description: DOH dengue surveillance, cases and deaths by region and month
    agency: Department of Health
    obtained_via: eFOI
    ticket_number: null
    original_file: dengue_surveillance_2021_2025.csv
    path: diseases/restricted/doh_foi/dengue/doh_foi_dengue_region_monthly_2021_2025.csv
    format: csv
    delimiter: ","
    encoding: utf-8
    header_mode: single
    skip_rows: 0
    bronze_table: "public_health.bronze.diseases_doh_foi_dengue_bronze"
    required_columns: [Year, Month, Region, Cases, Deaths]
    as_of_date: 2025-09-30
    load_mode: upsert
    merge_keys: [region_name, year, month]
    sharing: restricted
    coverage: 2021-01 to 2025-09, 18 regions (includes Negros Island Region)
    column_map:
      Year: year
      Month: month
      Region: region_name
      Cases: cases
      Deaths: deaths
    disease:
      disease_key: dengue
      geo_level: region
      geo_match_on: region_name
      period_grain: month
      period_columns: {year: year, month: month}
      metrics: [cases, deaths]
    qc:
      expected_rows: 1026
      numeric_columns: [Year, Month, Cases, Deaths]
      control_totals:
        group_by: Year
        sum: Cases
        expected: {2021: 80919, 2022: 264390, 2023: 214638, 2024: 413960, 2025: 240540}
    notes:
      - The FOI request was filed around September 2025, so the file ends at September 2025.
      - 2025 is a partial year (January to September). Never compare it with a full year.
      - The last months before extraction (about July to September 2025) are likely incomplete because of reporting lag.
      - A newer DOH file with a later as_of_date will replace overlapping months through the upsert.

  # ---------------------------------------------------------------------------
  # 2. UP NOAH dengue: region x week, 2016-2019 and 2022-2025  (OPEN, ODbL)
  # ---------------------------------------------------------------------------
  upnoah:
    description: UP NOAH dengue and environmental variables, regional weekly sheet
    agency: UP Resilience Institute (NOAH)
    obtained_via: public download (GitHub)
    url: https://github.com/UPRI-NOAH/dengue-rainfall-dataset
    doi: 10.5281/zenodo.19448854
    original_file: Dengue_Environmental Vars_Dataset.xlsx
    path: diseases/upnoah/upnoah_dengue_region_weekly_2016_2025.xlsx
    format: xlsx
    sheet: Regional Data
    header_mode: single
    skip_rows: 0
    bronze_table: "public_health.bronze.diseases_upnoah_dengue_regional_bronze"
    required_columns: [REGION, YR, WN, DC_DOH, FLAG_DEKADAL_APPROX, FLAG_PLAUSIBILITY]
    as_of_date: 2026-10-02
    load_mode: upsert
    merge_keys: [region_name, year, week]
    sharing: open
    license: ODbL v1.0 (attribution, share-alike)
    coverage: 2016-2019 and 2022-2025 weekly, 17 regions; 2020-2021 absent
    column_map:
      REGION: region_name
      YR: year
      WN: week
      DC_DOH: cases
    passthrough_bronze_only: [RF_HDX, Temp_ERA5-Land, SH_ERA5-Land]
    quality_flag_columns: [FLAG_DEKADAL_APPROX, FLAG_PLAUSIBILITY]
    disease:
      disease_key: dengue
      geo_level: region
      geo_match_on: region_name
      period_grain: week
      period_columns: {year: year, week: week}
      metrics: [cases]
    qc:
      expected_rows: 7072
      numeric_columns: [YR, WN, DC_DOH]
    control_file: diseases/upnoah/PH_REGIONS-DC.csv   # used in silver QC, not bronze
    notes:
      - 17 regions, old definition (no Negros Island Region).
      - Keep week as a number; week definition is not fully reconciled in the README.
      - Week 53 is folded into week 52 per the README.

  # ---------------------------------------------------------------------------
  # 3. HDX dengue: province x week, 2016-2020 plus a separate 2021 file (OPEN)
  # ---------------------------------------------------------------------------
  hdx_dengue:
    description: Dengue cases and deaths by province and week
    agency: Humanitarian Data Exchange (HDX)
    obtained_via: public download
    url: https://data.humdata.org/dataset/philippine-dengue-cases-and-deaths
    path: diseases/hdx_dengue
    files:
      - hdx_dengue_province_weekly_2016_2021.csv
      - hdx_dengue_province_weekly_2021.csv
    format: csv
    delimiter: ","
    encoding: utf-8
    header_mode: single
    skip_rows: 0
    bronze_table: "public_health.bronze.diseases_hdx_dengue_bronze"
    required_columns: [loc, cases, deaths, date, Region]     # `year` exists only in the 2021 file
    header_check:
      - {row: 1, expect: {0: "#adm2", 1: "#affected", 3: "#date"}}   # HXL tag row sits right under the header
    as_of_date: 2026-10-02
    load_mode: upsert
    merge_keys: [province_name, period_date]
    sharing: open
    license: CC BY (Creative Commons Attribution International)
    license_url: https://docs.humdata.org/about/data-licenses
    coverage: 2016 to 2021, weekly, by province (first file runs to early Jan 2021; second file covers 2021)
    column_map:
      loc: province_name
      cases: cases
      deaths: deaths
      date: period_date
      Region: region_name
      year: source_year
    optional_columns: [year]
    silver_row_filters:
      - "province_name NOT LIKE '#%'"       # HXL tag row under the header
    disease:
      disease_key: dengue
      geo_level: province
      geo_match_on: province_name
      period_grain: week
      period_columns: {date: period_date}
      date_format: M/d/yyyy
      metrics: [cases, deaths]
    qc:
      expected_rows:
        hdx_dengue_province_weekly_2016_2021.csv: 32702
        hdx_dengue_province_weekly_2021.csv: 253
      numeric_columns: [cases, deaths]
      max_non_numeric_rows_per_file: 1      # the HXL tag row
    notes:
      - Use the original download. Excel reinterprets dates with day <= 12.
      - Check every province has dates exactly 7 days apart.
      - Expect older province names (Compostela Valley, undivided Maguindanao).
      - Assign region from the province via the geography table.
      - Derive year and week from the parsed date, not from the source year column.
      - loc includes highly urbanized cities (e.g. ANGELES CITY) as separate rows.

  # ---------------------------------------------------------------------------
  # 4. DOH FOI tuberculosis, Region II: seven stacked tables  (RESTRICTED, bronze only)
  # ---------------------------------------------------------------------------
  doh_foi_tb_region2:
    description: DOH Region II TB data 2020-2025 (incidence, notifications, mortality, cases by province, municipality, age and sex)
    agency: Department of Health
    obtained_via: eFOI
    ticket_number: null
    original_file: Requested 2020-2025 TB Data from FOI - Sheet1.csv
    path: diseases/restricted/doh_foi/tb/doh_foi_tb_region2_annual_2020_2025.csv
    format: csv
    delimiter: ","
    encoding: utf-8
    header_mode: none                      # stacked tables, no single header row -> col_0 .. col_12
    skip_rows: 0
    bronze_table: "public_health.bronze.diseases_doh_foi_tb_region2_bronze"
    header_check:                          # the seven stacked tables must start where expected
      - {row: 0, expect: {0: "Annual TB Incidence per 100,000"}}
      - {row: 1, expect: {0: "Year", 1: "2020", 6: "2025"}}
      - {row: 3, expect: {0: "Annual TB Notification"}}
      - {row: 6, expect: {0: "Annual TB Mortality"}}
      - {row: 9, expect: {0: "TB Cases per Province"}}
      - {row: 10, expect: {1: "2020", 6: "2025"}}
      - {row: 16, expect: {0: "TB Cases per City"}}
      - {row: 116, expect: {0: "disaggregated by Age and Sex"}}
      - {row: 117, expect: {0: "Age/Sex", 1: "2020", 11: "2025"}}
      - {row: 118, expect: {1: "Male", 2: "Female", 11: "Male", 12: "Female"}}
    as_of_date: 2026-10-01     # CONFIRM date received
    load_mode: latest_file
    silver_enabled: false
    sharing: restricted
    coverage: Region II only, 2020-2025, annual
    qc:
      expected_rows: 127
      skip_checks: [B08]                  # repeated year header rows between the stacked tables
    notes:
      - Seven tables stacked in one sheet; split them in silver by the title rows.
      - Numbers mix plain and comma formats; "n/a" appears; age band "45-44" should be 45-54.
      - Some municipalities are split into numbered units (Aparri 1, Aparri 2).
      - Municipality table has no province column; Quirino and Quezon repeat across provinces.

  # ===========================================================================
  # PSA registered deaths by cause. One entry per layout (level x grain).
  # Year is not a column in these files: silver reads it from _source_file.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 5. PSA deaths: national x month, 2020-2024  (OPEN)
  # ---------------------------------------------------------------------------
  psa_deaths_national_monthly:
    description: Registered deaths by cause of death and month of occurrence, Philippines
    agency: Philippine Statistics Authority
    obtained_via: PSA Deaths Statistical Tables (2020-2022) and OpenSTAT (2023-2024)
    path: diseases/psa_deaths/national_monthly
    header_mode: names
    columns: [cause_of_death, total, january, february, march, april, may, june,
              july, august, september, october, november, december]
    files:
      # Each file checks: the year in its title, the header cells, and that the first data row is Total.
      - name: psa_deaths_national_monthly_2020.xlsx
        sheet: T10
        data_start_row: 4
        header_check: [{row: 0, expect: {0: "Philippines: 2020"}}, {row: 1, expect: {0: "Cause of Death", 1: "Total", 2: "Month of Occurrence"}}, {row: 2, expect: {2: "January", 7: "June", 13: "December"}}, {row: 4, expect: {0: "Total"}}]
      - name: psa_deaths_national_monthly_2021.xlsx
        sheet: T11
        data_start_row: 4
        header_check: [{row: 0, expect: {0: "Philippines: 2021"}}, {row: 1, expect: {0: "Cause of Death", 1: "Total", 2: "Month of Occurrence"}}, {row: 2, expect: {2: "January", 7: "June", 13: "December"}}, {row: 4, expect: {0: "Total"}}]
      - name: psa_deaths_national_monthly_2022.xlsx
        sheet: T13
        data_start_row: 4
        header_check: [{row: 0, expect: {0: "Philippines: 2022"}}, {row: 1, expect: {0: "Cause of Death", 1: "Total", 2: "Month of Occurrence"}}, {row: 2, expect: {2: "January", 7: "June", 13: "December"}}, {row: 4, expect: {0: "Total"}}]
      - name: psa_deaths_national_monthly_2023.csv
        data_start_row: 2
        header_check: [{row: 0, expect: {0: "Philippines: 2023"}}, {row: 1, expect: {0: "Cause of Death", 1: "Total", 2: "January", 7: "June", 13: "December"}}, {row: 2, expect: {0: "Total"}}]
      - name: psa_deaths_national_monthly_2024.csv
        data_start_row: 2
        header_check: [{row: 0, expect: {0: "Philippines: 2024"}}, {row: 1, expect: {0: "Cause of Death", 1: "Total", 2: "January", 7: "June", 13: "December"}}, {row: 2, expect: {0: "Total"}}]
    delimiter: ","
    encoding: utf-8
    bronze_table: "public_health.bronze.diseases_psa_deaths_national_monthly_bronze"
    as_of_date: 2026-10-04
    load_mode: upsert
    merge_keys: [cause_code, year, month]
    sharing: open
    license: CC BY 4.0
    disease:
      geo_level: national
      period_grain: month
      metrics: [deaths]
    qc:
      expected_rows:
        psa_deaths_national_monthly_2020.xlsx: 117
        psa_deaths_national_monthly_2021.xlsx: 120
        psa_deaths_national_monthly_2022.xlsx: 120
        psa_deaths_national_monthly_2023.csv: 116
        psa_deaths_national_monthly_2024.csv: 116
      numeric_columns: [total, january, december]
      row_sum:
        total: total
        parts: [january, february, march, april, may, june, july, august, september, october, november, december]
      control_values:
        - {label: "2020 all causes", column: total, expected: 613936, where: "upper(trim(cause_of_death)) = 'TOTAL' AND _source_file LIKE '%_2020.%'"}
        - {label: "2021 all causes", column: total, expected: 879429, where: "upper(trim(cause_of_death)) = 'TOTAL' AND _source_file LIKE '%_2021.%'"}
        - {label: "2022 all causes", column: total, expected: 679766, where: "upper(trim(cause_of_death)) = 'TOTAL' AND _source_file LIKE '%_2022.%'"}
        - {label: "2023 all causes", column: total, expected: 694821, where: "upper(trim(cause_of_death)) = 'TOTAL' AND _source_file LIKE '%_2023.%'"}
        - {label: "2024 all causes", column: total, expected: 701884, where: "upper(trim(cause_of_death)) = 'TOTAL' AND _source_file LIKE '%_2024.%'"}
    notes:
      - Excel files hold many sheets; only the cause-by-month sheet is loaded.
      - Source and notes lines at the bottom of each Excel sheet are loaded as rows; drop them in silver.
      - Cause labels differ by year (1-005, ....1-005, long dash, optional ICD range). Extract the code in silver.
      - Group and detail rows are both present; map diseases from detail codes only.
      - 2020-2022 are pandemic years. COVID rows have no cause code.

  # ---------------------------------------------------------------------------
  # 6. PSA deaths: region x year, by age group, 2023-2024  (OPEN)
  # ---------------------------------------------------------------------------
  psa_deaths_region_annual:
    description: Registered deaths by cause, region of usual residence and age group (both sexes)
    agency: Philippine Statistics Authority
    obtained_via: OpenSTAT
    path: diseases/psa_deaths/region_annual
    header_mode: names
    data_start_row: 3
    columns: [geolocation, cause_of_death, total, under_1, age_1_4, age_5_9, age_10_14, age_15_19,
              age_20_24, age_25_29, age_30_34, age_35_39, age_40_44, age_45_49, age_50_54, age_55_59,
              age_60_64, age_65_69, age_70_74, age_75_79, age_80_84, age_85_over, age_not_stated]
    files:
      - name: psa_deaths_region_annual_2023.csv
        header_check: [{row: 0, expect: {0: "Philippines: 2023"}}, {row: 2, expect: {0: "Geolocation", 1: "Cause of Death", 2: "Total Both Sexes", 3: "Under 1", 21: "85 and over", 22: "Not Stated"}}, {row: 3, expect: {0: "Philippines", 1: "Total"}}]
      - name: psa_deaths_region_annual_2024.csv
        header_check: [{row: 0, expect: {0: "Philippines: 2024"}}, {row: 2, expect: {0: "Geolocation", 1: "Cause of Death", 2: "Total Both Sexes", 3: "Under 1", 21: "85 and over", 22: "Not Stated"}}, {row: 3, expect: {0: "Philippines", 1: "Total"}}]
    delimiter: ";"
    encoding: cp1252
    bronze_table: "public_health.bronze.diseases_psa_deaths_region_annual_bronze"
    as_of_date: 2026-10-01
    load_mode: upsert
    merge_keys: [region_name, cause_code, year]
    sharing: open
    license: CC BY 4.0
    disease:
      geo_level: region
      period_grain: year
      metrics: [deaths]
    qc:
      expected_rows:
        psa_deaths_region_annual_2023.csv: 2204
        psa_deaths_region_annual_2024.csv: 2320
      numeric_columns: [total]
      control_values:
        - {label: "2023 Philippines all causes", column: total, expected: 694821, where: "geolocation = 'Philippines' AND upper(trim(cause_of_death)) = 'TOTAL' AND _source_file LIKE '%_2023.%'"}
        - {label: "2024 Philippines all causes", column: total, expected: 701884, where: "geolocation = 'Philippines' AND upper(trim(cause_of_death)) = 'TOTAL' AND _source_file LIKE '%_2024.%'"}
    notes:
      - Geolocation includes Philippines and FOREIGN COUNTRY; exclude both from regional totals.
      - 2023 has 19 geographies, 2024 has 20 (Negros Island Region added).
      - Only the total column goes to the silver disease table; age columns stay in bronze.

  # ---------------------------------------------------------------------------
  # 7. PSA deaths: national x year, 2015-2020  (OPEN)
  # ---------------------------------------------------------------------------
  psa_deaths_national_annual:
    description: Registered deaths by cause, Philippines, 2015-2020 (2020 preliminary)
    agency: Philippine Statistics Authority
    obtained_via: PSA press release attachment (Table 4)
    path: diseases/psa_deaths/national_annual
    header_mode: names
    columns: [cause_of_death, deaths_2015, deaths_2016, deaths_2017, deaths_2018, deaths_2019,
              deaths_2020_prelim, average_2015_2019]
    files:
      - {name: psa_deaths_national_annual_2015_2020.xlsx, sheet: Sheet1, data_start_row: 4}
    bronze_table: "public_health.bronze.diseases_psa_deaths_national_annual_bronze"
    header_check:
      - {row: 0, expect: {0: "Table 4"}}
      - {row: 1, expect: {0: "Preliminary as of 26 February 2021"}}    # a newer release fails here on purpose: update as_of_date too
      - {row: 2, expect: {0: "Cause of Death", 1: "2015", 2: "2016", 3: "2017", 4: "2018", 5: "2019", 6: "2020", 7: "Average"}}
      - {row: 4, expect: {0: "Total"}}
    as_of_date: 2021-02-26                 # stated in the file
    load_mode: upsert
    merge_keys: [cause_code, year]
    sharing: open
    disease:
      geo_level: national
      period_grain: year
      metrics: [deaths]
    qc:
      expected_rows: 119
      numeric_columns: [deaths_2015, deaths_2019, deaths_2020_prelim]
      null_tokens: ["*"]
      control_values:
        - {label: "2015 all causes", column: deaths_2015, expected: 560605, where: "trim(cause_of_death) = 'Total'"}
        - {label: "2019 all causes", column: deaths_2019, expected: 620414, where: "trim(cause_of_death) = 'Total'"}
    notes:
      - Use 2015-2019 only. The 2020 column is preliminary; final 2020 is in national_monthly.
      - average_2015_2019 is derived; do not load it to silver.
      - "* means not applicable (COVID rows before 2020)."

  # ---------------------------------------------------------------------------
  # 8. PSA deaths: province and region x year, by sex, 2006-2015  (OPEN)
  # ---------------------------------------------------------------------------
  psa_deaths_province_annual:
    description: Deaths by cause, sex and usual residence (region and province), 2006-2015
    agency: Philippine Statistics Authority
    obtained_via: PSA Vital Statistics Report tables (Table 2)
    path: diseases/psa_deaths/province_annual
    header_mode: names
    data_start_row: 5
    columns: [area_name, cause_of_death,
              male_2006, female_2006, male_2007, female_2007, male_2008, female_2008,
              male_2009, female_2009, male_2010, female_2010, male_2011, female_2011,
              male_2012, female_2012, male_2013, female_2013, male_2014, female_2014,
              male_2015, female_2015]
    files:
      - psa_deaths_province_annual_2006_2015.csv
    delimiter: ","
    encoding: utf-8
    bronze_table: "public_health.bronze.diseases_psa_deaths_province_annual_bronze"
    header_check:
      - {row: 0, expect: {0: "Table 2. Number of Deaths by Cause"}}
      - {row: 2, expect: {0: "Cause of Death and Usual Residence", 2: "2006", 4: "2007", 10: "2010", 20: "2015"}}
      - {row: 3, expect: {2: "Male", 3: "Female", 20: "Male", 21: "Female"}}
      - {row: 5, expect: {0: "PHILIPPINES"}}
    as_of_date: 2026-10-01
    load_mode: upsert
    merge_keys: [area_name, cause_name, year]
    sharing: open
    disease:
      geo_level: [national, region, province]
      period_grain: year
      metrics: [deaths]
    qc:
      expected_rows: 9224
      skip_checks: [B08]                  # cause rows repeat across area blocks by design
      numeric_columns: [male_2006, female_2015]
      null_tokens: ["-"]
      control_values:
        - {label: "2006 Philippines male", column: male_2006, expected: 258300, where: "trim(area_name) = 'PHILIPPINES'"}
        - {label: "2015 Philippines female", column: female_2015, expected: 238981, where: "trim(area_name) = 'PHILIPPINES'"}
    notes:
      - Stacked blocks. A row with area_name filled is the area total; the cause rows under it have area_name blank. Carry area_name down in silver.
      - 86 causes with no cause codes. Map names to codes using the 2015 column of national_annual.
      - "- means zero. Values have spaces and thousands separators."
      - Old geography: 17 regions, ARMM, Compostela Valley, NCR districts, FOREIGN COUNTRY block.
      - Use 2006-2014 from this file; 2015 overlaps national_annual (use as a control check).

  # ===========================================================================
  # DOH FHSIS annual tables
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 9. FHSIS tuberculosis: municipality x year, 2024 and 2025  (PUBLIC)
  # ---------------------------------------------------------------------------
  doh_fhsis_tb:
    description: FHSIS TB case notification (all forms and drug-resistant), by area
    agency: Department of Health
    obtained_via: FHSIS annual report tables
    path: diseases/doh_fhsis                          # original Excel workbooks
    header_mode: names
    columns: {0: psgc_code, 1: area_name, 2: population, 3: cases_male, 4: cases_female,
              5: cases_total, 6: case_notification_rate, 7: dr_cases_male, 8: dr_cases_female,
