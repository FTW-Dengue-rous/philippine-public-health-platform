    header_mode: names
    columns: {0: psgc_code, 1: area_name,
              2: population_0_14, 3: cohort_cases_0_14,
              4: success_0_14_male, 5: success_0_14_female, 6: success_0_14_total, 7: success_0_14_pct,
              8: population_15_over, 9: cohort_cases_15_over,
              10: success_15_over_male, 11: success_15_over_female, 12: success_15_over_total, 13: success_15_over_pct,
              14: cohort_cases_age_unknown,
              15: success_age_unknown_male, 16: success_age_unknown_female, 17: success_age_unknown_total,
              18: population_all, 19: cohort_cases_all,
              20: success_all_male, 21: success_all_female, 22: success_all_total, 23: success_all_pct}
    files:
      - name: doh_fhsis_tb_municipality_annual_2025.xlsx
        sheet: TSR-DSTB
        data_start_row: 6
        header_check:
          - {row: 1, expect: {4: "Table 2.F.7.4"}}
          - {row: 2, expect: {4: "Annual 2025"}}
          - {row: 4, expect: {0: "PSGC", 1: "Region, Province/City", 2: "Projected Population", 3: "(0-14)", 9: "15 years old and above", 14: "Null/Unknown/Invalid", 18: "all ages", 19: "all ages", 20: "All ages"}}
          - {row: 5, expect: {4: "Male", 6: "Total", 7: "%", 13: "%", 17: "Total", 20: "Male", 22: "Total", 23: "%"}}
          - {row: 6, expect: {1: "PHILIPPINES"}}
      - name: doh_fhsis_tb_municipality_annual_2025.xlsx
        sheet: TSR-MDRTB
        data_start_row: 6
        header_check:
          - {row: 1, expect: {4: "Table 2.F.7.5"}}
          - {row: 2, expect: {4: "Annual 2025"}}
          - {row: 4, expect: {0: "PSGC", 1: "Region, Province/City", 2: "Projected Population", 3: "(0-14)", 9: "15 yrs old and above", 14: "Null/Unknown/Invalid", 18: "all ages", 19: "all ages", 20: "All Ages"}}
          - {row: 5, expect: {4: "Male", 6: "Total", 7: "%", 13: "%", 17: "Total", 20: "Male", 22: "Total", 23: "%"}}
          - {row: 6, expect: {1: "PHILIPPINES"}}
    bronze_table: "public_health.bronze.diseases_fhsis_tb_treatment_success_bronze"
    as_of_date: 2026-10-02
    load_mode: upsert
    merge_keys: [psgc_code, year, drug_resistance]   # drug_resistance comes from _source_sheet in silver
    sharing: public
    source_key_override: doh_fhsis
    silver_target: "public_health.silver.diseases_tb_programme_silver"   # planned
    coverage: 2025 annual; Philippines, 18 regions, 116 provinces/HUCs, 1,609 cities and municipalities
    qc:
      expected_rows: 3496                 # 1,748 per sheet (1,744 area rows + 4 source/legend lines) x 2 sheets
      numeric_columns: [cohort_cases_all, success_all_total, success_all_pct]
      null_tokens: ["*"]
      row_sum:
        total: success_all_total
        parts: [success_all_male, success_all_female]
      control_values:
        - {label: "2025 Philippines DSTB cohort", column: cohort_cases_all, expected: 414185, where: "upper(trim(area_name)) = 'PHILIPPINES' AND _source_sheet = 'TSR-DSTB'",
           silver: {indicator: treatment_cohort, drug_resistance: drug_susceptible, year: 2025}}
        - {label: "2025 Philippines DSTB cured and completed", column: success_all_total, expected: 382547, where: "upper(trim(area_name)) = 'PHILIPPINES' AND _source_sheet = 'TSR-DSTB'",
           silver: {indicator: treatment_success, drug_resistance: drug_susceptible, year: 2025}}
        - {label: "2025 Philippines RR/MDR-TB cohort", column: cohort_cases_all, expected: 7721, where: "upper(trim(area_name)) = 'PHILIPPINES' AND _source_sheet = 'TSR-MDRTB'",
           silver: {indicator: treatment_cohort, drug_resistance: drug_resistant, year: 2025}}
        - {label: "2025 Philippines RR/MDR-TB cured and completed", column: success_all_total, expected: 5030, where: "upper(trim(area_name)) = 'PHILIPPINES' AND _source_sheet = 'TSR-MDRTB'",
           silver: {indicator: treatment_success, drug_resistance: drug_resistant, year: 2025}}
    notes:
      - "Treatment success = cured + treatment completed, over the cases in the treatment cohort (cohort_cases_*). success_*_pct = success_*_total / cohort_cases_* x 100 (checked: Philippines DSTB 382,547 / 414,185 = 92.36%)."
      - The cohort is the group of cases whose treatment outcome is reported in 2025, not the 2025 notifications. Never divide by notified cases from doh_fhsis_tb.
      - success_*_male and success_*_female are cured/completed counts by sex; the cohort is not split by sex.
      - Age groups 0-14, 15+ and unknown add up to all ages.
      - Sheet TSR-DSTB = drug-susceptible TB (all forms), TSR-MDRTB = rifampicin-resistant / multidrug-resistant TB. Silver derives drug_resistance from _source_sheet.
      - 2025 only. 9 area rows are blank (no report). PSGC code is blank on the Philippines row.
      - The long-format sheet "TSR" holds the same data with numerators and denominators by sex and age; not loaded.

