sources:
  psgc_population:
    source_name: PSA PSGC
    source_system: PSA PSGC
    source_endpoint: PSGC API
    version: Q2_2024

    bronze_table: public_health.bronze.geography_bronze
    geography_silver_table: public_health.silver.geography_silver

    metadata_table: public_health.bronze.ingestion_metadata
    qc_results_table: public_health.quality.qc_results

    qc:
      required_columns:
        - psgc_code
        - area_name
        - geographic_level
        - source_version
        - populations_json
        - source_system
        - source_endpoint
        - batch_id
        - content_checksum
        - raw_path
        - ingested_at

      # B10 WARN, checked 2026-10-19: 94 of 127,945 nested population values are text that does
      # not cast to a whole number as it stands (thousands separators, a leading bracketed note
      # such as "(excluding CITY OF ANGELES) 1,234", or "-"). Expected: population_silver parses
      # them (VALID / VALID_WITH_NOTE / MISSING) and silver QC S52 / S53 check the result.
      skip_checks:
        - B02
        - B03
        - B06
        - B08
        - B09
        - B11
        - B12
        - B14