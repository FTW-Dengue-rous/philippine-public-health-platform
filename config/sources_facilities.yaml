      - {name: doh_fhsis_demographic_province_annual_2021.xlsx, sheet: "BGY & BHS", data_start_row: 7, columns: *bgy_2019_2024}
      - {name: doh_fhsis_demographic_province_annual_2022.xlsx, sheet: "BGY & BHS", data_start_row: 7, columns: *bgy_2019_2024}
      - {name: doh_fhsis_demographic_province_annual_2023.xlsx, sheet: "BGY & BHS", data_start_row: 8, columns: *bgy_2019_2024}
      - {name: doh_fhsis_demographic_province_annual_2024.xlsx, sheet: "BGY & BHS", data_start_row: 7, columns: *bgy_2019_2024}
      - {name: doh_fhsis_demographic_municipality_annual_2025.xlsx, sheet: "BGY & BHS", data_start_row: 7, columns: *bgy_2025}
    bronze_table: "public_health.bronze.facilities_fhsis_primary_care_bronze"
    as_of_date: 2026-10-05                 # download date; CONFIRM
    load_mode: upsert
    merge_keys: [area_name, year]          # year from _source_file
    sharing: public
    coverage: 2018-2025 annual; national, region, province and city (no municipality rows, even in 2025)
    qc:
      expected_rows:                       # local test 2026-10-05
        doh_fhsis_demographic_province_annual_2018.xlsx: 215
        doh_fhsis_demographic_province_annual_2019.xlsx: 197
        doh_fhsis_demographic_province_annual_2020.xlsx: 198
        doh_fhsis_demographic_province_annual_2021.xlsx: 197
        doh_fhsis_demographic_province_annual_2022.xlsx: 197
        doh_fhsis_demographic_province_annual_2023.xlsx: 144
        doh_fhsis_demographic_province_annual_2024.xlsx: 142
        doh_fhsis_demographic_municipality_annual_2025.xlsx: 146
      numeric_columns: [population, barangays_no, bhs_no]
      null_tokens: ["*", "#DIV/0!"]
      max_non_numeric_rows_per_file: 6     # legend and source lines at the bottom
      control_values:
        - {label: "2018 Philippines BHS", column: bhs_no, expected: 21546, where: "upper(trim(area_name)) = 'PHILIPPINES' AND _source_file LIKE '%_2018.%'"}
        - {label: "2024 Philippines BHS", column: bhs_no, expected: 25532, where: "upper(trim(area_name)) = 'PHILIPPINES' AND _source_file LIKE '%_2024.%'"}
        - {label: "2025 Philippines BHS", column: bhs_no, expected: 26944, where: "upper(trim(area_name)) = 'PHILIPPINES' AND _source_file LIKE '%_2025.%'"}
        - {label: "2024 Philippines barangays", column: barangays_no, expected: 41590, where: "upper(trim(area_name)) = 'PHILIPPINES' AND _source_file LIKE '%_2024.%'"}
