    original_file: bed_occupancy_rate_2025_1.xlsx
    path: facilities/restricted
    header_mode: single
    skip_rows: 0
    files:
      - {name: bed_occupancy_hospital_annual_2020_2025.xlsx, sheet: "2020"}
      - {name: bed_occupancy_hospital_annual_2020_2025.xlsx, sheet: "2021"}
      - {name: bed_occupancy_hospital_annual_2020_2025.xlsx, sheet: "2022"}
      - {name: bed_occupancy_hospital_annual_2020_2025.xlsx, sheet: "2023"}
      - {name: bed_occupancy_hospital_annual_2020_2025.xlsx, sheet: "2024"}
      - {name: bed_occupancy_hospital_annual_2020_2025.xlsx, sheet: "2025"}
    bronze_table: "public_health.bronze.facilities_bed_occupancy_bronze"
    as_of_date: 2026-09-29                 # CONFIRM
    load_mode: upsert
    sharing: restricted                    # permission to quote still to confirm
    qc:
      expected_rows: 1977                  # 174 + 184 + 174 + 160 + 123 + 1,162 (one file, six sheets)
      skip_checks: [B08]                  # no hospital id: identical rows are different hospitals (3 cases)
      numeric_columns: [Bed_Occupancy_Rate_BOR_Based_on_Authorized_Beds]
    notes:
      - Year is the sheet name (_source_sheet).
      - One row per hospital but no hospital name or code. 2020-2024 go to city/municipality; 2025 only to province (joins at province level).
      - 2025 adds Authorized_Bed_Capacity and Implementing_Beds; City/Municipality is absent in 2025.
      - General = hospital level (Level 1/2/3); blank on some rows. BOR above 100 is possible (more patients than authorized beds).
      - 2020-2024 sheets are PRIVATE hospitals only (123-184 rows). 2025 has 418 Government and 744 Private. Government BOR exists for 2025 only.
      - Do not trend counts across years; the 2020-2024 sample is not the same set of hospitals.

