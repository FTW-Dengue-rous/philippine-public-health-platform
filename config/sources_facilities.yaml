      - Layout changes by year. 2018 has barangays and BHS only. 2019-2024 split health centers into MHC, CHC and RHU plus a total. 2025 has barangays, RHU and BHS only.
      - 2025 "Rural Health Units" (2,612 nationally) is close to the 2024 total of all health centers (2,720), not 2024 RHUs (1,777). Treat 2025 rhu_no as all health centers; CONFIRM with DOH.
      - Barangay counts move between years (41,539 in 2023 to 43,253 in 2025). Use PSGC barangay counts from the geography domain as the reference.
      - Ratios are population per unit. Recompute in gold.
      - No PSGC in any year, including 2025 on this tab. Match area_name to geography in silver.
      - The 2025 file is named "municipality" after its finest tab (Health Workers); this tab stops at province and city.
      - 2020 has an empty spacer column that loads as col_14.

  # ===========================================================================
  # PSA Philippine Statistical Yearbook history tables
  # Table numbers change between editions (bed capacity is 9.17 in newer
  # editions, hospitals by region is 9.17 in the 2019/2020 and 2024 editions).
  # Identify a table by its title, not its number.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 14. PSA Table 9.16 (PSY 2019/2020): hospitals and bed capacity, national, 1990-2015  (OPEN)
  # ---------------------------------------------------------------------------
  psa_hospitals_beds_national_annual:
    description: Number of hospitals and bed capacity by ownership (government, private), Philippines
    agency: Philippine Statistics Authority (from DOH)
    obtained_via: Philippine Statistical Yearbook 2019/2020, Table 9.16
    original_file: 201920T9_16.csv
    path: facilities/psa_beds/national_annual
    files:
      - psa_hospitals_beds_national_annual_1990_2015.csv
    delimiter: ","
    encoding: utf-8
    header_mode: names                     # two header rows (groups at row 2, Total/Government/Private at row 4)
    data_start_row: 6
    columns: {0: year, 1: hospitals_total, 3: hospitals_government, 5: hospitals_private,
              7: beds_total, 9: beds_government, 11: beds_private,
              13: beds_per_10000, 14: population_basis}
    header_check:                          # verified on the PSY 2019/2020 file
      - {row: 0, expect: {0: "Number of Hospitals and Bed Capacity"}}
      - {row: 2, expect: {0: "Year", 1: "Number of Hospitals", 7: "Bed Capacity", 13: "per 10,000"}}
      - {row: 4, expect: {1: "Total", 3: "Government", 5: "Private", 7: "Total", 9: "Government", 11: "Private"}}
    bronze_table: "public_health.bronze.facilities_psa_hospitals_beds_national_annual_bronze"
    as_of_date: 2026-10-06                 # download date; CONFIRM
    load_mode: upsert
    merge_keys: [year]
    sharing: open
    coverage: 1990-2015 annual, national; beds missing for 2015
    qc:
      expected_rows: 32                   # 26 years + 6 footnote and source lines
      numeric_columns: [hospitals_total, beds_total]
      null_tokens: ["-"]
      max_non_numeric_rows_per_file: 6     # footnotes a-e and the source line
      row_sum:
        total: hospitals_total
        parts: [hospitals_government, hospitals_private]
      control_values:
        - {label: "1990 Philippines beds", column: beds_total, expected: 87133, where: "trim(year) = '1990'"}
        - {label: "2014 Philippines beds", column: beds_total, expected: 98429, where: "trim(year) = '2014'"}
    notes:
      - Use for beds 1990-2014 (the only national bed series before 2020). Hospital counts 2006-2015 equal psa_hospitals_national_annual.
      - 2015 beds are "-" (not available). Null, not zero.
      - population_basis is a footnote letter (a = census count, b-e = projections from the 1990/1995/2000/2010 census). beds_per_10000 is source-computed; recompute rates in gold.
      - Hospitals drop 1,825 to 1,454 from 2012 to 2013 (definition change), but beds only dip 101,366 to 96,796. Mark a series break.
      - Values have trailing spaces and thousands separators. Spacer rows are skipped by the loader; footnote and source lines load as rows (drop in silver).

  # ---------------------------------------------------------------------------
  # 15. PSA Table 9.17 (PSY 2024): hospitals by ownership and region, 2005-2015  (OPEN)
  #     Same content as psa_hospitals_region_annual (2020-2024), older layout.
  #     Kept as its own table; union the two in silver on (region, ownership, year).
  # ---------------------------------------------------------------------------
  psa_hospitals_region_annual_legacy:
    description: Number of hospitals by type (government, private) and region, older yearbook layout
    agency: Philippine Statistics Authority (from DOH)
    obtained_via: Philippine Statistical Yearbook 2024, Table 9.17
    original_file: 2024_T9_17.csv
    path: facilities/psa_hospitals/regional_annual_legacy
    files:
      - psa_hospitals_region_annual_2005_2015.csv
    delimiter: ","
    encoding: utf-8
    header_mode: none                      # year blocks; region header at row 3
    data_start_row: 0
    header_check:                          # verified on the PSY 2024 file
      - {row: 0, expect: {0: "Number of Hospitals by Type and by Region"}}
      - {row: 2, expect: {0: "Year", 1: "Philippines"}}
      - {row: 3, expect: {3: "NCR", 4: "CAR", 9: "MIMAROPA", 18: "Caraga", 19: "BARMM"}}
    bronze_table: "public_health.bronze.facilities_psa_hospitals_region_annual_legacy_bronze"
    as_of_date: 2026-10-06                 # download date; CONFIRM
    load_mode: upsert
    merge_keys: [region_name, ownership, year]
    sharing: open
    coverage: 2005-2015 annual, Philippines + 17 regions, Total / Government / Private
    qc:
      expected_rows: 49                   # 33 data rows + year, title, header, footnote and source rows
    notes:
      - Transposed version of psa_hospitals_region_annual - regions are columns, ownership x year are rows. col_0 = year (block header) or ownership, col_1 = Philippines, col_3..col_19 = NCR..BARMM (names in row 3). Carry the year down in silver.
      - Region labels are short codes (I, IV-A, Caraga); the 2020-2024 table uses long names. Map both to region codes.
      - The column labelled BARMM is ARMM for 2005-2015; Caraga = Region XIII.
      - Years "2013 a" and "2014 a" carry footnote a (general and specialty hospitals only). The 2012 to 2013 drop (1,825 to 1,454) is a definition change; mark a series break.
      - Large 2014 drops in some regions (MIMAROPA 64 to 21, Region V 110 to 54) follow the same definition change.
      - National totals equal Table 9.16 for every year. The 2019/2020 yearbook copy has identical values (labels XIII, ARMM); not ingested.
      - Gap 2016-2019 before the 2020-2024 table.
